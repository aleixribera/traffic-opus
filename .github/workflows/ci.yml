name: CI

# Every push to main (and every PR) type-checks, builds the game with Vite, and runs the test suite, quick and scenarios,
# split by time over eight runners (tests/durations.json) so the whole run takes about a minute. Docs-only changes skip it.
# Hosting lives on the home server (https://aleix.tailfef0f7.ts.net/kilometre-zero/).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # (tsc --noEmit, then vite build)

  test:
    runs-on: ubuntu-latest
    # (the budget: each shard takes about a minute; past 3 the job fails loudly instead of creeping up)
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (the balance playthrough takes hours on a runner and the late-save soak test most of one: they run on the test
      # laptop, the one before a release, the other after a change to the traffic sim)
      - run: npx vitest run --project quick --project scenarios --shard=${{ matrix.shard }}/8
      # (each file's time on a runner: `node tools/durations.mjs report-*/test-report.json` refreshes tests/durations.json)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.shard }}
          path: test-report.json
          retention-days: 14
