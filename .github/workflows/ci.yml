name: CI

# Every push to main type-checks, builds the game with Vite, and runs the test suite.
# Hosting lives on the home server (https://aleix.tailfef0f7.ts.net/kilometre-zero/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (the balance playthrough takes hours on a runner and the late-save soak test most of one: they run locally, the
      # one before a release, the other after a change to the traffic sim)
      - run: npx vitest run --exclude tests/balance.test.ts --exclude tests/latesave.test.ts
